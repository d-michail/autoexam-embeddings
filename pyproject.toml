[tool.poetry]
name = "autoexam-embeddings"
version = "0.1.0"
description = "Internal configurable Sentence Transformers embedding service for AutoExam"
authors = ["AutoExam contributors"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "autoexam_embeddings", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
anyio = "4.10.0"
fastapi = "0.116.1"
numpy = "2.2.6"
pydantic = "2.11.7"
sentence-transformers = "5.1.0"
torch = { version = "2.8.0+cpu", source = "pytorch-cpu" }
uvicorn = { version = "0.35.0", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
httpx = "0.28.1"
mypy = "1.17.1"
pytest = "8.4.1"
pytest-asyncio = "1.1.0"
pytest-cov = "6.2.1"
ruff = "0.12.8"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=autoexam_embeddings --cov-report=term-missing"
markers = [
  "integration: requires the pinned Hugging Face model in cache or network access",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["autoexam_embeddings"]
mypy_path = "src"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
